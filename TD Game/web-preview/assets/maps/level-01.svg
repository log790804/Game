<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-label="森林草地塔防關卡地圖">
  <defs>
    <linearGradient id="grassBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ee067"/>
      <stop offset="0.46" stop-color="#66bd49"/>
      <stop offset="1" stop-color="#3f983f"/>
    </linearGradient>
    <radialGradient id="grassGlow" cx="48%" cy="43%" r="70%">
      <stop offset="0" stop-color="#b7ec72" stop-opacity="0.72"/>
      <stop offset="0.62" stop-color="#65be47" stop-opacity="0.22"/>
